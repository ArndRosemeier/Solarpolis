name: Pages
# Publishes main to GitHub Pages after each merge's changelog fold (whose push, made with the workflow token, starts
# no other workflow), so the deployed What's new button shows the version that merge became. Separate from CI: the
# PR check never waits on a deploy. Start it by hand with Actions → Pages → Run workflow.
on:
  workflow_run:
    workflows: [Changelog]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - run: npm ci --no-audit --no-fund
      # The Actors asset pack (bodies, skins, clothes, hair, clips) for the installed version, cached between runs.
      - uses: actions/cache@v4
        with:
          path: .actors-pack
          key: actors-pack-${{ hashFiles('package-lock.json') }}
          restore-keys: actors-pack-
      - run: node tools/actors/pack.mjs
      - run: npx vite build --mode publish
        env:
          SOLARPOLIS_BASE: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
